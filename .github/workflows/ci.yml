name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Library, control and routing tests
        run: cargo test --locked --lib --test control --test routing
      - name: Messaging and peer tests
        run: cargo test --locked --test messaging --test peer_auth -- --test-threads=1
      - name: LAN discovery, pairing and admin tests
        run: cargo test --locked --test lan --test lan_messaging --test admin_messaging --test shell_daemon --test update --test remote --test spawn
  macos-install:
    # Drives the real installer on a clean runner: LaunchAgent, menu-bar icon,
    # stop, reinstall and uninstall (never run against a developer's service).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo build --locked
      - name: Install with stand-in Codex and Claude commands
        run: |
          stubs="$RUNNER_TEMP/stubs"
          mkdir -p "$stubs"
          for name in codex claude; do
            printf '#!/bin/sh\necho %s "$@" >> "%s/calls.log"\n' "$name" "$stubs" > "$stubs/$name"
            chmod +x "$stubs/$name"
          done
          # The real `codex mcp add` writes this entry; install then marks it required.
          mkdir -p "$HOME/.codex"
          printf '[mcp_servers.session-bridge]\ncommand = "session-bridge"\n' > "$HOME/.codex/config.toml"
          PATH="$stubs:$PATH" ./target/debug/session-bridge install
          cat "$stubs/calls.log"
      - name: Service, menu-bar icon, stop, reinstall, uninstall
        run: |
          bridge="$HOME/.local/bin/session-bridge"
          service="gui/$(id -u)/com.aileron-tech.session-bridge"
          plist="$HOME/Library/LaunchAgents/com.aileron-tech.session-bridge.plist"
          up() { for i in $(seq 1 50); do "$bridge" status >/dev/null 2>&1 && return 0; sleep 0.2; done; return 1; }
          up || { cat "$HOME/.local/state/session-bridge/daemon.stderr.log"; exit 1; }
          launchctl print "$service" | grep -E "state =|path ="
          grep -q SESSION_BRIDGE_TRAY "$plist"
          pid=$("$bridge" status | python3 -c 'import json,sys; print(json.load(sys.stdin)["pid"])')
          for i in $(seq 1 50); do pgrep -P "$pid" >/dev/null && break; sleep 0.2; done
          pgrep -P "$pid" || { echo "No menu-bar icon process"; cat "$HOME/.local/state/session-bridge/daemon.stderr.log"; exit 1; }
          grep "Menu bar: " "$HOME/.local/state/session-bridge/daemon.stderr.log" | tail -1
          "$bridge" stop | tee stop.txt
          grep -q "Stopped the background service" stop.txt
          if launchctl print "$service" >/dev/null 2>&1; then echo "Service still loaded after stop"; exit 1; fi
          PATH="$RUNNER_TEMP/stubs:$PATH" "$bridge" install
          up
          "$bridge" uninstall | tee uninstall.txt
          grep -q "Removed the background service" uninstall.txt
          test ! -e "$plist"
          if launchctl print "$service" >/dev/null 2>&1; then echo "Service still loaded after uninstall"; exit 1; fi
          "$bridge" uninstall | grep -q "No background service is installed"
  windows-install:
    # Drives the real installer: logon task, background service, CLI readback.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo build --locked
      - name: Install with stand-in Codex and Claude commands
        shell: pwsh
        run: |
          $stubs = Join-Path $env:RUNNER_TEMP 'stubs'
          New-Item -ItemType Directory -Path $stubs | Out-Null
          foreach ($name in 'codex', 'claude') {
            Set-Content -Path (Join-Path $stubs "$name.cmd") -Value "@echo $name %*>> `"$stubs\calls.log`""
          }
          $env:PATH = "$stubs;$env:PATH"
          .\target\debug\session-bridge.exe install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content (Join-Path $stubs 'calls.log')
      - name: Read back the service
        shell: pwsh
        run: |
          $bridge = Join-Path $env:USERPROFILE '.local\bin\session-bridge.exe'
          $status = & $bridge status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "service pid $($status.pid)"
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'first.pid') -Value $status.pid
          schtasks.exe /Query /TN session-bridge /V /FO LIST
          Get-Content (Join-Path $env:USERPROFILE '.local\state\session-bridge\daemon.stderr.log')
      - name: Reinstall while the service runs
        shell: pwsh
        run: |
          $stubs = Join-Path $env:RUNNER_TEMP 'stubs'
          $env:PATH = "$stubs;$env:PATH"
          .\target\debug\session-bridge.exe install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $status = & (Join-Path $env:USERPROFILE '.local\bin\session-bridge.exe') status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $first = Get-Content (Join-Path $env:RUNNER_TEMP 'first.pid')
          "service pid $($status.pid), before reinstall $first"
          if ("$($status.pid)" -eq "$first") { Write-Error 'Reinstall kept the old service process'; exit 1 }
          if (Get-Process -Id $first -ErrorAction SilentlyContinue) { Write-Error 'Old service process is still alive'; exit 1 }
      - name: Uninstall the service, then run the bridge from a shell
        shell: pwsh
        run: |
          $bridge = Join-Path $env:USERPROFILE '.local\bin\session-bridge.exe'
          $pid0 = (& $bridge status | ConvertFrom-Json).pid
          & $bridge uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          schtasks.exe /Query /TN session-bridge 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error 'The logon task is still registered'; exit 1 }
          Start-Sleep -Seconds 2
          if (Get-Process -Id $pid0 -ErrorAction SilentlyContinue) { Write-Error 'The service process is still alive'; exit 1 }
          $out = & $bridge uninstall
          if ("$out" -notmatch 'No background service is installed') { Write-Error "Second uninstall: $out"; exit 1 }
          $shell = Start-Process -FilePath $bridge -ArgumentList 'daemon' -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..50) {
            & $bridge status *> $null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Milliseconds 200
          }
          Stop-Process -Id $shell.Id -Force
          if (-not $ok) { Write-Error 'The bridge started from a shell did not answer'; exit 1 }
          'shell daemon answered'
