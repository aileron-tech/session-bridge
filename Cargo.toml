[package]
name = "session-bridge"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1"
axum = "0.8.9"
data-encoding = "2.11.1"
fs2 = "0.4"
gethostname = "1.1.0"
getrandom = "0.4.3"
hmac = "0.13.0"
mdns-sd = "0.22.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
rmcp = { version = "3.10.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.2"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
spake2 = "0.4.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk", "system"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[target.'cfg(unix)'.dependencies]
# Waking a Codex thread through its app server's control socket (REQ-015).
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
libc = "0.2"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
resvg = { version = "0.50.0", default-features = false }
tao = "0.38.0"
tray-icon = "0.27.0"

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
proptest = "1.12.0"
tempfile = "3"

[profile.dev]
# Keep local debug builds compact.
debug = "line-tables-only"

