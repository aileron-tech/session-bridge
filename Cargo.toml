[package]
name = "session-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1"
fs2 = "0.4"
libc = "0.2"
rmcp = { version = "3.10.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Keep local debug builds compact.
debug = "line-tables-only"

